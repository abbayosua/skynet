 10.489 282.857 10.489C280.427 10.489 278.467 11.128 276.976 12.4058C276.443 12.8619 275.976 13.3667 275.57 13.9154V3.61426H269.552V32.7716H275.57V20.0878C275.67 19.8122 275.79 19.5415 275.927 19.2806C276.455 18.2661 277.169 17.4564 278.066 16.8516C278.963 16.2468 279.968 15.942 281.075 15.942C282.554 15.942 283.669 16.3444 284.422 17.1467C285.175 17.949 285.551 19.1294 285.551 20.6829V32.7716H291.57V19.6147C291.57 17.7442 291.205 16.1249 290.479 14.7543V14.7568Z\" fill=\"#020202\" style=\"fill:#020202;fill:color(display-p3 0.0066 0.0066 0.0066);fill-opacity:1;\"/>\n        <defs>\n        <clipPath id=\"clip0_1_56\">\n        <rect width=\"38\" height=\"38\" fill=\"white\" style=\"fill:white;fill-opacity:1;\" transform=\"translate(0 1)\"/>\n        </clipPath>\n        <clipPath id=\"clip1_1_56\">\n        <rect width=\"38\" height=\"38\" fill=\"white\" style=\"fill:white;fill-opacity:1;\" transform=\"translate(0 1)\"/>\n        </clipPath>\n        </defs>\n      </svg>\n    <div class=\"container-text\">\n      <h2 >Your request was blocked by our firewall</h2>\n      The most common causes for this problem are:\n      <ul>\n        <li>\n          A search was blocked because of dangerous keywords.\n        </li>\n        <li>\n          Your IP is not allowed, which may be related to VPN issues.\n        </li>\n      </ul>\n      <br>\n      If you believe this is incorrect and require further troubleshooting please contact <a href=\"/cdn-cgi/l/email-protection#72010702021d000632011d07001117150013021a5c111d1f\">Sourcegraph Support</a> with the information below:\n      <br>\n      <br>\n      Ray ID: a3c743a59ecefda3\n      <br>\n    </div>\n  </div>\n<script data-cfasync=\"false\">!function(){\"use strict\";function e(e){try{if(\"undefined\"==typeof console)return;\"error\"in console?console.error(e):console.log(e)}catch(e){}}function t(e){return d.innerHTML='<a href=\"'+e.replace(/\"/g,\"&quot;\")+'\"></a>',d.childNodes[0].getAttribute(\"href\")||\"\"}functio