name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GONOSUMDB: "charm.land/*"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "~1.26"
          cache: true

      # Linux build
      - run: |
          mkdir -p dist/linux
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X github.com/abbayosua/skynet/internal/version.Version=$VERSION" -o dist/linux/skynet .

      # Windows build
      - run: |
          mkdir -p dist/windows
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -X github.com/abbayosua/skynet/internal/version.Version=$VERSION" -o dist/windows/skynet.exe .

      # .deb package
      - run: |
          mkdir -p dist/deb/usr/bin
          cp dist/linux/skynet dist/deb/usr/bin/
          mkdir -p dist/deb/DEBIAN
          cat > dist/deb/DEBIAN/control <<EOF
          Package: skynet
          Version: ${VERSION#v}
          Section: devel
          Priority: optional
          Architecture: amd64
          Maintainer: abbayosua
          Description: A powerful terminal-based AI assistant
          EOF
          dpkg-deb --build dist/deb dist/skynet_${VERSION}_linux_amd64.deb

      # Archives
      - run: tar -czf dist/skynet_${VERSION}_linux_amd64.tar.gz -C dist/linux skynet
      - run: cd dist/windows && zip -r ../skynet_${VERSION}_windows_amd64.zip skynet.exe

      # Install scripts
      - run: cp scripts/install.sh scripts/install.ps1 dist/

      # Checksums
      - run: cd dist && sha256sum *.deb *.tar.gz *.zip *.sh *.ps1 > checksums.txt

      # GitHub Release
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
