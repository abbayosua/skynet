name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GONOSUMDB: "charm.land/*"

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "~1.26"
          cache: true
      - run: CGO_ENABLED=0 go build -o skynet-linux .
      - run: go vet ./...
      - uses: actions/upload-artifact@v4
        with:
          name: skynet-linux
          path: skynet-linux

  windows:
    runs-on: windows-latest
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "~1.26"
          cache: true
      - run: go build -o skynet-windows.exe .
      - run: go vet ./...
      - uses: actions/upload-artifact@v4
        with:
          name: skynet-windows
          path: skynet-windows.exe
