name: build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  GONOSUMDB: "charm.land/*"

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "~1.26"
          cache: true
      - run: CGO_ENABLED=0 go build -o skynet-linux .
      - run: go vet ./...
      - uses: actions/upload-artifact@v4
        with:
          name: skynet-linux
          path: skynet-linux

  macos-amd64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "~1.26"
          cache: true
      - run: CGO_ENABLED=0 GOARCH=amd64 go build -o skynet-darwin-amd64 .
      - run: go vet ./...
      - uses: actions/upload-artifact@v4
        with:
          name: skynet-darwin-amd64
          path: skynet-darwin-amd64

  macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "~1.26"
          cache: true
      - run: CGO_ENABLED=0 GOARCH=arm64 go build -o skynet-darwin-arm64 .
      - run: go vet ./...
      - uses: actions/upload-artifact@v4
        with:
          name: skynet-darwin-arm64
          path: skynet-darwin-arm64

  windows:
    runs-on: windows-latest
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "~1.26"
          cache: true
      - run: go build -o skynet-windows.exe .
      - run: go vet ./...
      - uses: actions/upload-artifact@v4
        with:
          name: skynet-windows
          path: skynet-windows.exe
