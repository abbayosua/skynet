name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GONOSUMDB: "charm.land/*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "~1.26"
          cache: true
      - run: go build ./...
      - run: go vet ./...
